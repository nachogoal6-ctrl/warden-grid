<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Warden Grid mark v2: hooded sentinel in a faceted shield. Original design for this project. -->
  <defs>
    <linearGradient id="wr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e6fff0"/><stop offset=".35" stop-color="#7dffb4"/><stop offset="1" stop-color="#169a52"/></linearGradient>
    <linearGradient id="wl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#062414"/><stop offset="1" stop-color="#03130a"/></linearGradient>
    <linearGradient id="wrt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#020b06"/><stop offset="1" stop-color="#051c0f"/></linearGradient>
    <linearGradient id="hl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6dffaa"/><stop offset="1" stop-color="#1fb463"/></linearGradient>
    <linearGradient id="hr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2fd679"/><stop offset="1" stop-color="#0c6435"/></linearGradient>
    <linearGradient id="vz" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3dff8f"/><stop offset=".5" stop-color="#f4fff8"/><stop offset="1" stop-color="#3dff8f"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#3dff8f" stop-opacity=".55"/><stop offset="1" stop-color="#3dff8f" stop-opacity="0"/></radialGradient>
  </defs>
  <!-- shield: rim, then two bevelled halves -->
  <path d="M32 2.5 58 12.2V32.2c0 14.8-10.8 24.6-26 30C16.8 56.8 6 47 6 32.2V12.2Z" fill="url(#wr)"/>
  <path d="M32 6.2V58C19.6 53.2 9.6 44.6 9.6 32.2V14.6Z" fill="url(#wl)"/>
  <path d="M32 6.2 54.4 14.6V32.2C54.4 44.6 44.4 53.2 32 58Z" fill="url(#wrt)"/>
  <!-- circuit traces in the shield -->
  <g fill="none" stroke="#1d7a45" stroke-width=".7" opacity=".9">
    <path d="M12.5 20h4.5l3 3v9"/><path d="M51.5 20H47l-3 3v9"/><path d="M16 13.5h5l3 3"/><path d="M48 13.5h-5l-3 3"/>
  </g>
  <g fill="#3dff8f"><circle cx="12.5" cy="20" r=".9"/><circle cx="51.5" cy="20" r=".9"/><circle cx="16" cy="13.5" r=".8"/><circle cx="48" cy="13.5" r=".8"/></g>
  <!-- hooded sentinel: lit left facet, shaded right facet -->
  <path d="M32 10.5 20 25v9.4l-7.4 7.4v3.6c5 5.6 11.6 9.4 19.4 11.9Z" fill="url(#hl)"/>
  <path d="M32 10.5 44 25v9.4l7.4 7.4v3.6C46.4 51 39.8 54.8 32 57.3Z" fill="url(#hr)"/>
  <path d="M32 10.5V25" stroke="#c9ffdd" stroke-width=".7" opacity=".6"/>
  <!-- face cavity and visor -->
  <circle cx="32" cy="31.2" r="11" fill="url(#glow)"/>
  <path d="M23.6 25.8h16.8v8.4l-4.2 4.2h-8.4l-4.2-4.2Z" fill="#010402"/>
  <rect x="25.2" y="29.4" width="13.6" height="3" rx=".4" fill="url(#vz)"/>
  <rect x="25.2" y="29.4" width="13.6" height=".9" fill="#ffffff" opacity=".8"/>
  <!-- chest: W as a circuit chevron with nodes -->
  <path d="M24.8 45.2 28.4 49 32 45.2 35.6 49 39.2 45.2" fill="none" stroke="#010402" stroke-width="2.4" stroke-linecap="square" stroke-linejoin="miter"/>
  <g fill="#010402"><circle cx="24.8" cy="45.2" r="1.3"/><circle cx="39.2" cy="45.2" r="1.3"/></g>
</svg>
